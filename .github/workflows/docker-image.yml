name: Docker Image for Docker Hub

on:
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build . -t noothanms998/dataneuron_assignment_1:latest
    - name: Push image to docker hub
      run: docker push dataneuronapp:latest
    - name: push image to dockerhub
      run: |
        docker login -u noothanms998 -p ${{ secrets.DOCKERHUB_SECRET }}
        docker push noothanms998/dataneuron_assignment_1:latest
      
